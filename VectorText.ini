; ===========================================================================
;  VectorText M0 -- configuration
;  This file must sit next to gamemd.exe (build.bat copies it there).
;  Everything here only affects *logging*; the DLL never changes what the game
;  draws, and deleting the DLL removes it completely.
; ===========================================================================

[VectorText]

; 0 = do nothing at all (hooks stay installed but return immediately)
Enabled=1

; 1 = record every distinct string once (plus counters)
; 0 = counters only (smallest log / fastest)
Detailed=1

; BitFont::Blit runs once per glyph, i.e. hundreds of times per frame.
; 0 = counters only;  1 = also record which characters are drawn (glyph usage)
LogBitFontBlitDetails=0

; upper bound for the distinct-string table (protects against pathological spam)
; a 5 minute session produced ~4000 distinct strings, so the default is raised
MaxUniqueStrings=20000

; how often the per-hook counters are written to the log, in milliseconds
FlushIntervalMs=2000

; log file name, created in the game directory
LogFileName=VectorText.log

; ===========================================================================
;  M1 -- vector text rendering (接管字形像素)
;
;  Mode=observe  : M0 behaviour.  Hooks only observe; the game draws as always.
;  Mode=swap     : our vector glyphs replace the game's bitmap glyphs *in the
;                  font data itself*.  The engine draws them with its own code,
;                  so layout/shadows/colour ramps are untouched and nothing in
;                  the call flow changes.  => the safe way to see vector text.
;  Mode=aa       : antialiased vector text.  We blend our glyph into the game's
;                  16-bit surface ourselves and zero the engine's bitmap for that
;                  character, so the engine's own pass draws nothing.  The call
;                  flow is never modified -> no stack games, no crashes.
;  Mode=swap     : vector text without antialiasing (engine draws our 1bpp cell).
;  Mode=draw     : own pixel writes + skipping the engine's Blit; that skip
;                  crashes, so this mode is for debugging only.
;                  requires skipping the engine's Blit.  That skip currently
;                  crashes the game, so use swap until it is fixed.
;  Mode=off      : hooks do nothing at all.
;  Mode=aa       : antialiased vector text.  We blend our glyph into the game's
;                  16-bit surface ourselves and zero the engine's bitmap for that
;                  character, so the engine's own pass draws nothing.  The call
;                  flow is never modified -> no stack games, no crashes.
;  Mode=swap     : vector text without antialiasing (engine draws our 1bpp cell).
;  Mode=draw     : own pixel writes + skipping the engine's Blit; that skip
;                  crashes, so this mode is for debugging only.
;                  pixel, inside the game's own 16-bit surfaces.
;  Mode=off      : hooks do nothing at all.
;
;  Layout, wrapping, alignment, shadows and the per-character colour ramp are
;  still computed by the game -- only the glyph pixels change.  Set Mode=draw
;  and restart the game to try it; set it back to observe to revert.
; ===========================================================================
Mode=aa

; vector font (any TrueType/OpenType file FreeType can read)
FontFile=C:\Windows\Fonts\NotoSerifSC-VF.ttf

; NotoSerifSC-VF's default instance is ExtraLight(200); 400 = Regular
FontWeight=700

; FreeType stem darkening (0 = off): thickens stems while rasterising, which
; is the designed cure for antialiased text looking too light at small sizes.
StemDarkening=120

; coverage gamma for the antialiased path (1.0 = linear, >1 = heavier/less hazy)
Gamma=1.40

; Supersample=1 : rasterise at the target size
; Supersample=2 : rasterise at 2x and box-downsample (smoother coverage, and
;                 the 1bpp fallback mask lands closer to the original metrics)
Supersample=2

; Subpixel=1 : carry the fractional advance across glyphs and bake it into the
;              glyph as a quarter-pixel phase (needs Metrics=scaled/vector for
;              fractional advances; applies to Mode=aa)
Subpixel=1

; measured against game.fnt: Latin/ASCII ink matches at 13px, CJK fills the
; 16-row cell only at 16px -- the game's own font is two sizes as well
FontSizeLatin=13
FontSizeCJK=16

; row inside the 16-row cell that sits on the text baseline
BaselineRow=13

; 1 = condense glyphs that are wider than the original advance so neighbouring
;     characters can never overlap (uses area/OR merging, keeps thin strokes)
FitToAdvance=1

; Metrics=game   : keep the engine's own advances (layout byte-identical, glyphs
;                 condensed into the original cells)
; Metrics=scaled : advance = round(game * AdvanceScale); slightly wider cells, so
;                 glyphs are squeezed less and strokes stay thicker
; Metrics=vector : FreeType's natural advances (best letterforms, but text is
;                 ~38% wider and fixed UI boxes need auditing - see the audit tool)
Metrics=scaled
AdvanceScale=1.05

; 1 = antialiased text (coverage blended into the 16-bit surface -- this works
;     because the surfaces are 16bpp, not a palette)
; 0 = hard 1bpp pixels, useful for pixel-exact comparison against the original
AntiAlias=1

; 1 = if anything goes wrong, fall back to the game's own drawing and log it
FallbackOnError=1

; 1 = on the first glyph of every BitFont object, write one PROBE line with the
;     runtime layout we read (buffer/pitch/colour/bounds/lines/symbol table).
;     This works in Mode=observe too, so a single safe run proves the layout
;     before draw mode is enabled.  Costs one log line per font object.
Probe=1

; 1 = we draw the glyph and skip the engine's Blit (normal operation)
; 0 = we draw the glyph AND let the engine draw its own on top: same drawing
;     code, no change to the call flow.  Use 0 to test whether our pixels are
;     safe in-game before enabling the skip.
SkipOriginal=1
