[VectorText]
; 逐字符渲染：坐标、换行、测量和字距继续由游戏决定。
Enabled=1
Mode=draw
Metrics=game
AdvanceScale=1.0

; 保持原始比例。溢出的轮廓只等比缩小，不横压、不填满16行。
FitToAdvance=1
FitMode=1
ClassAlign=0

; 中文保留思源宋体；英文窄体匹配原版小字距，统一字号与字重。
FontFile=C:\Windows\Fonts\NotoSerifSC-VF.ttf
FontFileLatin=C:\Windows\Fonts\ARIALNB.TTF
FontWeight=500
FontSizeLatin=13
FontSizeCJK=16
BaselineRow=13

; 高分辨率采样，保留覆盖率；游戏整数步进无需累计亚像素相位。
Supersample=4
Subpixel=0
Gamma=1.00
StemDarkening=0
LinearBlend=1
Dither=0
Outline=0
OutlineColor=0x0000
Probe=1
