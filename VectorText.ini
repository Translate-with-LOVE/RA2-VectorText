[VectorText]
; ============================================================================
;  VectorText -- vector (FreeType) text rendering for Mental Omega / YR
;  最终形态：完全接管渲染（draw 模式）+ 超分辨率光栅化 + 不失真字形
;  回退：Mode=observe 或 off（也可直接删除 VectorText.dll / VectorText.ini）
; ============================================================================
Enabled=1

; off | observe(原版) | swap(引擎画我们的1bpp字形) | aa(安全,抗锯齿) | draw(完全接管)
Mode=draw

; 光栅化质量
Supersample=3          ; 3x 超分辨率光栅化后盒式降采样（覆盖率更准、边缘更干净）
Subpixel=1             ; 1/4 像素相位（保留纵向 hinting，横画不会丢）
StemDarkening=100      ; FreeType 笔画加粗（治 AA 小字偏轻）
Gamma=1.30             ; 覆盖率伽马（压掉灰雾）

; 32 位中间合成：线性光混合 + 抖动量化（5/6/5 表面的带状过渡被打散）
LinearBlend=1
Dither=1

; 字体与字号：拉丁/中文同等对待，字号都比"点阵墨迹高度"更大，
; 因此笔画更饱满；步进仍由引擎给出，布局不受影响
FontFile=C:\Windows\Fonts\NotoSerifSC-VF.ttf
FontWeight=450         ; 可变字体字重（400=Regular, 500=Medium, 700=Bold）
FontSizeLatin=15
FontSizeCJK=17
BaselineRow=13

; 字形适配：0 = 保持自然宽度与比例（不失真，宽字可能轻微重叠）
;           1 = 压缩进步进格子（无重叠，但中文会被压窄约 20%）
FitToAdvance=0
FitMode=0              ; 0=横向压缩路径, 1=等比缩小路径（FitToAdvance=1 时才生效）

; 度量：game(原版) | scaled(原版 x AdvanceScale) | vector(FreeType 自然步进)
Metrics=scaled
AdvanceScale=1.05
; 固定尺寸 UI 框：命中该地址 ±1KB 的调用者保留引擎原度量
MetricsExcept=0x00553199

; 诊断
Probe=1
SkipOriginal=1