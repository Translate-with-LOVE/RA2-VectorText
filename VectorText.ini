[VectorText]
; ============================================================================
;  VectorText -- vector (FreeType) text for Mental Omega / YR
;  原则：测量宽度 = 缓存宽度 = 实际绘制步进；排版仍完全由引擎决定
;  回退：Mode=observe（原版渲染），或删除 VectorText.dll / VectorText.ini
; ============================================================================
Enabled=1

; off | observe(原版) | swap | aa | draw(完全接管)
Mode=draw

; --- 度量一致性（当前最重要的一项）----------------------------------------
; game  : 完全不改写引擎字距 → 测量、缓存、绘制天然一致（推荐）
; scaled: 步进 = 原版 x AdvanceScale（会回写字形表）
; vector: FreeType 自然步进（整体宽 ~38%，会撑坏固定框）
Metrics=game
AdvanceScale=1.05

; 1 = 把字形压进该字符的原字距（不重叠；这是英文连成一片的解药）
; 0 = 保留自然宽度（会与下一个字重叠，仅用于对比）
FitToAdvance=1
FitMode=0              ; 0=横向压缩 1=等比缩小（仅 FitToAdvance=1 时生效）

; --- 字形定位 ---------------------------------------------------------------
FontFile=C:\Windows\Fonts\NotoSerifSC-VF.ttf
FontWeight=450
FontSizeLatin=14
FontSizeCJK=16
BaselineRow=13         ; 与原版点阵一致；顶部溢出会被自动下移保护
ClipGuard=1

; --- 光栅化 ----------------------------------------------------------------
Supersample=4
Subpixel=1
Gamma=1.00             ; 1.0 = 关闭；>1 会提亮并"膨胀"低覆盖边缘
StemDarkening=60
LinearBlend=1
Dither=1
Outline=0
OutlineColor=0x0000

; --- 诊断 ------------------------------------------------------------------
Probe=1
SkipOriginal=1