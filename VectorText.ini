[VectorText]
; 单行覆盖：游戏决定换行和Y，补丁计算每行X；0回退逐字符渲染。
Enabled=1
Mode=draw
LineRender=1
; 动态任务目标框和战役背景条按自然宽度测量，并额外预留像素。
DynamicTextWidth=1
LineWidthPadding=4
Metrics=game
AdvanceScale=1.0

; 保持原始比例。溢出的轮廓只等比缩小，不横压、不填满16行。
FitToAdvance=1
FitMode=1
ClassAlign=0

; 小字号优先清晰笔画：中文无衬线中等字重，英文正常宽度常规体。
FontFile=C:\Windows\Fonts\NotoSansSC-VF.ttf
FontFileLatin=C:\Windows\Fonts\arial.ttf
FontWeight=450
FontSizeLatin=13
FontSizeCJK=16
BaselineRow=13

; 在实际像素网格上对齐笔画，FreeType 直接生成灰度覆盖率。
; Hinting：0=轻量纵向对齐，1=完整对齐，2=不对齐。
Supersample=1
Hinting=0
Subpixel=0
Gamma=1.00
StemDarkening=0
LinearBlend=1
Dither=0
Outline=0
OutlineColor=0x0000
Probe=1
