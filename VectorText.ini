[VectorText]
; bool 不区分大小写，支持 true/false、yes/no、on/off，兼容 1/0。
; 单行覆盖：游戏决定换行和Y，补丁计算每行X；false 回退逐字符渲染。
Enabled=true
; off=原生文字，observe=仅观测，draw=矢量绘制。其他值按 observe 处理。
; 关闭矢量接管请使用 Mode=off；Enabled 控制日志和 32 位呈现启动。
Mode=draw
; 正常运行只保留统计，避免频繁变化的金额/计时字符串持续建表和写盘。
Detailed=false
LineRender=true
; 混排时英文整段按大写高度与中文字面上下居中，共用基线；保留字体自身的上标和下伸笔画。
MixedScriptCenter=true
; 兼容原版 game.fnt 的 Windows-1252 旧码位 0x80–0x9F。
; false=严格按原始 Unicode 解释；不改 CSF 和引擎的字符/步进。
LegacyCodepage1252=true
; cnc-ddraw 存在时，文字在呈现纹理中直接合成为 BGRA8；false 使用 RGB565。
Present32=true
; true=跟随 cnc-ddraw 实际 X/Y 放大倍率，支持小数倍和宽屏拉伸；false=原合成。
; 仅 Direct3D9：按实际较大倍率向上取整，直接生成 2~8x 字形；4.8x3.6 使用 5x 源。
; 字形由 GPU 按两轴倍率投影；任一轴不放大/其他后端保留兼容路径。
HiDPI=true
; 过场字幕外缘：亮字用细黑边；暗字用更薄白内缘及同宽黑外缘，不随背景变色。
; HiDPI 亮字黑边约半个游戏像素，暗字白/黑各约四分之一（至少一个采样像素）。
; RGB565 回退为 1px；保留原字幕颜色。
SubtitleOutline=true
; 性能取证：每 300 帧记录文字绘制、复制、上传和叠加耗时，默认关闭。
PresentProfile=false
; 动态任务目标框和战役背景条按自然宽度测量，并额外预留像素。
; tooltip 保留原测量宽度下限及上下 2px；侧栏状态四周至少 2px。
; 任务消息左右至少 2px、上 1px、下 2px，使原生 19px 行距下背景相接。
DynamicTextWidth=true
LineWidthPadding=4
Metrics=game
AdvanceScale=1.0

; 保持原始比例。溢出的轮廓只等比缩小，不横压、不填满16行。
FitToAdvance=true

; 小字号优先清晰笔画：中文无衬线中等字重，英文正常宽度常规体。
FontFile=C:\Windows\Fonts\NotoSansSC-VF.ttf
FontFileLatin=C:\Windows\Fonts\arial.ttf
FontWeight=450
FontSizeLatin=13
FontSizeCJK=16
BaselineRow=13

; 轻量纵向 hinting 配合小数 X 定位，保留灰度边缘和原有笔画比例。
; Hinting：0=轻量纵向对齐，1=完整对齐，2=不对齐。
Supersample=1
Hinting=0
; false=字形落在最近的整数像素；自然步进、字距和测量仍保留小数。
; true=字形使用四分之一像素相位，边缘较柔和。
Subpixel=true
AntiAlias=true
Gamma=1.00
StemDarkening=0
LinearBlend=true
Dither=false
Outline=0
OutlineColor=0x0000
Probe=true
